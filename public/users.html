<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utilisateurs — Projet ART</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f4f4f5; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; max-width: 640px; margin: 0 auto 16px; }
    h1 { font-size: 1.1rem; margin: 0; }
    button { padding: 8px 14px; border: none; border-radius: 8px; background: #18181b; color: #fff; cursor: pointer; }
    ul { list-style: none; margin: 0 auto; padding: 0; max-width: 640px; }
    li { background: #fff; border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    img.avatar, .avatar-placeholder { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #e4e4e7; flex-shrink: 0; }
    .name { font-weight: 600; }
    .meta { color: #71717a; font-size: .85rem; }
    #empty { text-align: center; color: #71717a; margin-top: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>Utilisateurs inscrits</h1>
    <button id="logout-btn">Se déconnecter</button>
  </header>
  <ul id="user-list"></ul>
  <p id="empty" hidden>Aucun utilisateur pour le moment.</p>

  <script type="module">
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { auth, db } from "./js/firebase-init.js";

    // ST4 : écoute continue de l'état de session pour protéger la page.
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "./login.html";
        return;
      }
      const snapshot = await getDocs(collection(db, "users"));
      const listEl = document.getElementById("user-list");
      const emptyEl = document.getElementById("empty");

      if (snapshot.empty) {
        emptyEl.hidden = false;
        return;
      }

      snapshot.forEach((docSnap) => {
        const u = docSnap.data();
        const li = document.createElement("li");

        const avatar = u.photoUrl
          ? Object.assign(document.createElement("img"), { src: u.photoUrl, className: "avatar" })
          : Object.assign(document.createElement("div"), { className: "avatar-placeholder" });

        const info = document.createElement("div");
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = u.firstName ? `${u.firstName} ${u.lastName ?? ""}` : u.email;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = [u.userType, u.address].filter(Boolean).join(" · ") || u.email;
        info.append(name, meta);

        li.append(avatar, info);
        listEl.appendChild(li);
      });
    });

    document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));
  </script>
</body>
</html>
