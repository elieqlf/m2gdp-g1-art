name = "projet-art-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "3d01e59c36f8d072357c98cf331780f6"

[[d1_databases]]
binding = "DB"
database_name = "art-sessions"
database_id = "81a1ecbc-d289-41f8-96a4-e403b60a1a39"
# Anti-abus de l'envoi des liens de connexion (empreintes uniquement) :
#   npx wrangler d1 migrations apply art-sessions --remote
migrations_dir = "migrations"

# Stockage R2 : photos de couverture des activités (POST /uploads/cover, GET /files/…).
# Création (une fois, R2 activé sur le compte) : npx wrangler r2 bucket create art-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "art-files"

# Cloudflare Workers AI (modèles hébergés par Cloudflare, 10 000 Neurons gratuits par jour).
[ai]
binding = "AI"

[vars]
# Variables publiques (non sensibles) ici.
# Origines autorisées à appeler l'API, et vers lesquelles un lien de connexion peut ramener.
ALLOWED_ORIGINS = "https://novart-app.web.app,https://novart-app.firebaseapp.com,http://localhost:5173"
APP_URL = "https://novart-app.web.app"
SENDER_NAME = "NOVART"
# Projet Firebase dont les jetons de connexion sont acceptés pour l'envoi de photos.
FIREBASE_PROJECT_ID = "novart-109bf"
# Idées d'activités (POST /ai/activity-ideas) : Mistral Small via Workers AI (binding AI ci-dessus),
# gratuit dans la limite quotidienne du compte. MISTRAL_MODEL ne sert que si le secret
# MISTRAL_API_KEY (API Mistral payante) est déclaré.
MISTRAL_MODEL = "mistral-small-latest"
# Les secrets se déclarent avec (voir workers/README.md) :
#   npx wrangler secret put FIREBASE_SERVICE_ACCOUNT < /chemin/hors-depot/cle.json
#   npx wrangler secret put BREVO_API_KEY
#   npx wrangler secret put SENDER_EMAIL
#   npx wrangler secret put MISTRAL_API_KEY   (facultatif : API Mistral payante à la place de Workers AI)
# et se lisent en local via workers/.dev.vars (jamais commité)
